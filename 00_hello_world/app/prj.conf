# Application-level Kconfig overrides for freestanding build.
#
# 由来:
#   - 下記 board/prj.conf:                   CONFIG_MCUX_PRJSEG_module.board.pinmux_board_core_folder=y
#   - 下記 board/cm33_core0/prj.conf:        CONFIG_MCUX_COMPONENT_driver.reset=y
#                                            CONFIG_MCUX_PRJSEG_module.board.pinmux_project_folder=y
#
# SDK kconfig.cmake のフリースタンディング経路(line 342)で
# ${APP_DIR}/prj.conf の存在が必須のため、SDK ボード/コア prj.conf 内容を集約。

CONFIG_MCUX_COMPONENT_driver.reset=y
CONFIG_MCUX_PRJSEG_module.board.pinmux_board_core_folder=y
CONFIG_MCUX_PRJSEG_module.board.pinmux_project_folder=y
